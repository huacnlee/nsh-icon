[package]
name = "nsh-icon-tabler"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Tabler Icons icons for Native Shell (NSH) apps, drawn by nsh-icon: only the icons an app uses go into its binary and bundle"
repository.workspace = true
keywords = ["nsh", "nshm", "icons", "tabler", "svg"]
categories.workspace = true
include = ["/Cargo.toml", "/LICENSE", "/nsh.json", "/set.json", "/src/**", "/tsx/**"]

[lib]
name = "nsh_icon_tabler"

[features]
# `Tabler::ALL` and `Tabler::from_name`, a lookup by name over the whole set: it
# links every icon. `icon_set!` links only the icons it lists.
all = []

[dependencies]
nsh-core.workspace = true
nsh-icon.workspace = true

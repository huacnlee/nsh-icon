[package]
name = "nsh-icon-heroicons"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Heroicons icons for Native Shell (NSH) apps, drawn by nsh-icon: only the icons an app uses go into its binary and bundle"
repository.workspace = true
keywords = ["nsh", "nshm", "icons", "heroicons", "svg"]
categories.workspace = true
include = ["/Cargo.toml", "/LICENSE", "/nsh.json", "/set.json", "/src/**", "/tsx/**"]

[lib]
name = "nsh_icon_heroicons"

[features]
# `Heroicons::ALL` and `Heroicons::from_name`, a lookup by name over the whole set: it
# links every icon. `icon_set!` links only the icons it lists.
all = []

[dependencies]
nsh-core.workspace = true
nsh-icon.workspace = true

name: Release

# Pushing a tag `vX.Y.Z` on `main` publishes every crate at that version to crates.io and creates the
# GitHub release. Needs the repository secret CARGO_REGISTRY_TOKEN.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: The tag is the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nsh-icon") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Icon files match the pinned releases
        run: bun script/sync.ts --check
      - run: cargo test --workspace --all-features

      # nsh-icon first: the sets depend on it from crates.io. A crate already published at this
      # version is skipped, so a failed run can be run again.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in nsh-icon nsh-icon-lucide nsh-icon-heroicons nsh-icon-tabler nsh-icon-phosphor nsh-icon-remix; do
            if curl -sf -A "nsh-icon-release (github.com/huacnlee/nsh-icon)" \
                "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; then
              echo "$crate $VERSION is already published"
            else
              cargo publish -p "$crate"
            fi
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

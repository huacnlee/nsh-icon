[package]
name = "nsh-icon"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
description = "Icons for Native Shell (NSH) apps: the Icon type, icon() and the TSX <Icon>; the icon sets are the nsh-icon-* crates"
repository = "https://github.com/huacnlee/nsh-icon"
readme = "README.md"
keywords = ["nsh", "nshm", "icons", "svg"]
categories = ["gui"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/src/**"]

[workspace]
members = ["codegen", "sets/*"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
repository = "https://github.com/huacnlee/nsh-icon"
categories = ["gui"]

[workspace.dependencies]
nsh-icon = { version = "0.2.2", path = "." }
nsh-core = "0.7.0"
nsh-engine = { version = "0.7.0", default-features = false }
nsh-testing = { version = "0.7.0", default-features = false }

[lib]
name = "nsh_icon"

[dependencies]
# Icons are SVG: without `svg` (off in an app whose nsh-platform-* crates turn
# default features off) the native backends draw nothing for them.
nsh-core = { workspace = true, features = ["svg"] }

[dev-dependencies]
nsh-core = { workspace = true, features = ["declarations"] }
nsh-engine.workspace = true
nsh-testing.workspace = true
nsh-icon-lucide = { path = "sets/lucide" }

[profile.release]
strip = true
